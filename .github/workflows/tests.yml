name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,api]"
      - run: pytest -q
      - name: Offline pipeline smoke test
        run: |
          python -m pipeline.run --fixtures
          python -m pipeline.jobbank --file tests/fixtures/jobbank_sample.csv --month 2026-09
