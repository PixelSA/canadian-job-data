# Skill taxonomy. Editing this file changes the extractor version, which makes the
# pipeline re-extract every stored posting on its next run.
#
# Fields:
#   name       canonical name shown in the app
#   category   language | data | bi | ml | database | cloud | devops | web | tool | method
#   aliases    extra spellings, matched case-insensitively
#   implies    other skills to also credit (e.g. PostgreSQL -> SQL)
#   ambiguous  true for names that are also English words/letters (R, Go, Excel...).
#              These match only with exact capitalization AND context: a cue word next to
#              them, or another known skill within a few tokens.
#   cues       neighbouring words that confirm an ambiguous match ("R programming")
#   reject_prev / reject_next   neighbouring words that veto an ambiguous match

# ---- languages ----
- {name: Python, category: language}
- {name: SQL, category: language}
- {name: Java, category: language}
- {name: JavaScript, category: language, aliases: [js, ecmascript]}
- {name: TypeScript, category: language, aliases: [ts]}
- {name: C#, category: language, aliases: [c sharp, csharp]}
- {name: C++, category: language, aliases: [cpp]}
- name: C
  category: language
  ambiguous: true
  cues: [programming, language, embedded]
  reject_prev: [class, level, grade, plan, type, schedule, section, vitamin, part, appendix]
  reject_next: ["-", "&", level, suite, corp, class, "."]
- name: R
  category: language
  aliases: [rstudio, r programming, tidyverse]
  ambiguous: true
  cues: [programming, language, studio, shiny]
  reject_prev: [r, "&"]
  reject_next: ["&", "-", "."]
- name: Go
  category: language
  aliases: [golang]
  ambiguous: true
  cues: [programming, language, lang]
  reject_prev: [to, will, "let's", on, the, a, "'s"]
  reject_next: ["-", above, beyond, to, the, getter, live, ahead, through, for, back, into, out]
- {name: Rust, category: language}
- {name: Kotlin, category: language}
- name: Swift
  category: language
  ambiguous: true
  cues: [ios, swiftui, programming, language, xcode]
  reject_next: [response, action, pace, resolution]
- {name: PHP, category: language}
- {name: Ruby, category: language}
- {name: Scala, category: language}
- {name: Bash, category: language, aliases: [shell scripting, bash scripting]}
